[project]
name = "chat-backend"
version = "0.1.0"
description = "LLM chat backend (FastAPI + LangGraph)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-openai>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "aiosqlite>=0.20",
    "pydantic>=2.5",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "xlwings>=0.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
]
# 전체 앱을 한 번에: pip install -e ".[all]"
# 코팅 과제만 돌릴 거면 requirements-coating.txt 를 쓴다(base 의존성을 뺀 최소 세트).
all = ["chat-backend[dev,ml]"]
ml = [
    "pandas>=2.2",
    "pyarrow>=14.0",
    "scikit-learn>=1.4",
    "scipy>=1.13",
    "matplotlib>=3.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 패키지를 설치하지 않고(requirements-coating.txt 최소 설치) 테스트를 돌릴 때
# backend/ 를 sys.path 에 넣어준다. 없으면 `pytest` 로 부를 때만 조용히
# ModuleNotFoundError: app 이 난다(`python -m pytest` 는 cwd 덕에 우연히 된다).
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.coating" = ["meta/*.csv"]
